function getLane(date,type,part,name){
 const rows=laneRows[date]?.[type]||{};
 for(const [lane,arr] of Object.entries(rows)) if(arr[part-1]===name) return +lane;
 return null;
}

const ORDERS_KEY="ske37-imported-orders-v4";
const PROGRESS_KEY="ske37-progress-v4";
let orders=JSON.parse(localStorage.getItem(ORDERS_KEY)||"{}");
let progress=JSON.parse(localStorage.getItem(PROGRESS_KEY)||"{}");
let current="9/12",onlyRemaining=false;

function normalizeType(s){return s.includes("握手")?"握手":s.includes("トーク")?"トーク":s}
function normalizeMemberName(name){
 const aliases={"桑原椿":"桒原椿"};
 return aliases[name]||name;
}
function parseChunk(chunk){
 const noSpace=chunk.replace(/\u3000/g,"").replace(/\s+/g,"");
 const order=(noSpace.match(/■?注文番号[:：]?(\d+)/)||[])[1]||null;
 const items=[];
 const re=/商品名[:：](\d{1,2}\/\d{1,2})幕張\((\d+)部\)(.+?)「ため息未来」\/現地で(握手会|トーク会)参加券(?::1枚)?(?:(?!商品名).){0,500}?個数[:：](\d+)/g;
 let m;
 while((m=re.exec(noSpace))!==null){
   items.push({
     date:m[1],
     part:+m[2],
     name:normalizeMemberName(m[3]),
     type:normalizeType(m[4]),
     count:+m[5]
   });
 }
 return {order,items};
}
function splitMail(text){
 const marks=[...text.matchAll(/■注文番号/g)].map(m=>m.index);
 if(marks.length<=1)return [text];
 return marks.map((start,i)=>text.slice(start,marks[i+1]??text.length));
}
function simpleHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
async function importMail(){
 const text=document.getElementById("mailText").value.trim();
 const result=document.getElementById("result");
 if(!text){result.className="result err";result.textContent="メール本文を貼り付けてください。";return}
 const ok=await importParsedText(text,"テキスト");
 if(ok)document.getElementById("mailText").value="";
}

async function importParsedText(text, sourceLabel="テキスト"){
 const result=document.getElementById("result");
 const chunks=splitMail(text);
 let imported=0, ignored=0, orderCount=0;
 for(const chunk of chunks){
   const parsed=parseChunk(chunk);
   if(!parsed.items.length)continue;
   const supported=parsed.items.filter(x=>x.date==="9/12"||x.date==="9/13");
   ignored+=parsed.items.length-supported.length;
   if(!supported.length)continue;
   const id=parsed.order||("mail-"+simpleHash(chunk));
   orders[id]=supported;
   imported+=supported.reduce((s,x)=>s+x.count,0);
   orderCount++;
 }
 if(!orderCount){
   result.className="result err";
   result.textContent=`${sourceLabel}から9/12・9/13幕張の対象商品を読み取れませんでした。注文内容が載っているPDF/本文か確認してください。`;
   return false;
 }
 localStorage.setItem(ORDERS_KEY,JSON.stringify(orders));
 result.className="result "+(ignored?"warn":"ok");
 result.textContent=`取り込み完了：${orderCount}件の注文 / 対象券 ${imported}枚${ignored?`（他日程 ${ignored}商品は除外）`:""}`;
 render();
 return true;
}

async function importPdf(file){
 const status=document.getElementById("pdfStatus");
 if(!file)return;
 if(file.type && file.type!=="application/pdf" && !file.name.toLowerCase().endsWith(".pdf")){
   status.className="result err";
   status.textContent="PDFファイルを選択してください。";
   return;
 }
 status.className="result warn";
 status.textContent="PDFを解析中…";
 try{
   if(!window.pdfjsLib) throw new Error("PDF.js が読み込めませんでした");
   pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
   const bytes=new Uint8Array(await file.arrayBuffer());
   const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
   let text="";
   for(let p=1;p<=pdf.numPages;p++){
     const page=await pdf.getPage(p);
     const content=await page.getTextContent({normalizeWhitespace:true});
     text += "\n" + content.items.map(x=>x.str||"").join("\n");
   }
   const parsedCount=(text.replace(/\u3000/g,"").replace(/\s+/g,"").match(/商品名[:：]/g)||[]).length;
   const ok=await importParsedText(text,"PDF");
   if(ok){
     status.className="result ok";
     status.textContent=`PDF取込完了：${file.name}（商品欄 ${parsedCount}件を検出）`;
   }else{
     status.className="result err";
     status.textContent=`PDF内の商品欄は ${parsedCount}件検出しましたが、9/12・9/13幕張の券を抽出できませんでした。`;
   }
 }catch(e){
   console.error(e);
   status.className="result err";
   status.textContent="PDFの解析に失敗しました。Safariを再読み込みして再度試すか、下のテキスト貼り付けを使ってください。";
 }finally{
   document.getElementById("pdfFile").value="";
 }
}

function allTickets(date){
 const map=new Map();
 Object.values(orders).flat().filter(x=>x.date===date).forEach(x=>{
   const k=[x.part,x.name,x.type].join("|");
   const cur=map.get(k)||{...x,count:0};
   cur.count+=x.count; map.set(k,cur);
 });
 return [...map.values()].sort((a,b)=>a.part-b.part||a.type.localeCompare(b.type,"ja")||a.name.localeCompare(b.name,"ja"));
}
function pkey(date,x){return [date,x.part,x.name,x.type].join("|")}
function getUsed(date,x){return Math.max(0,Math.min(x.count,+(progress[pkey(date,x)]||0)))}
function setUsed(date,x,n){progress[pkey(date,x)]=Math.max(0,Math.min(x.count,n));localStorage.setItem(PROGRESS_KEY,JSON.stringify(progress));render()}

function render(){
 document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.date===current));
 const items=allTickets(current),app=document.getElementById("app");app.innerHTML="";
 const total=items.reduce((s,x)=>s+x.count,0),u=items.reduce((s,x)=>s+getUsed(current,x),0),completed=items.filter(x=>getUsed(current,x)===x.count).length;
 document.getElementById("total").textContent=total;document.getElementById("remaining").textContent=total-u;document.getElementById("doneParts").textContent=`${completed}/${items.length}`;
 document.getElementById("remainingOnly").textContent=onlyRemaining?"すべて表示":"残りだけ表示";
 if(!items.length){app.innerHTML='<div class="empty"><b>まだ参加券が登録されていません。</b><br>上から注文メールPDFを選ぶか、mu-moの「ご注文内容確認」メール本文を貼り付けてください。</div>';return}
 [...new Set(items.map(x=>x.part))].forEach(part=>{
   const group=items.filter(x=>x.part===part).filter(x=>!onlyRemaining||getUsed(current,x)<x.count);
   if(!group.length)return;
   const sec=document.createElement("section");sec.className="section";
   sec.innerHTML=`<div class="partHead"><div class="partTitle">${part}部</div><div class="time">${times[part][0]}<br>レーン締切 ${times[part][1]}</div></div>`;
   group.forEach(x=>{
     const u=getUsed(current,x),done=u===x.count,lane=getLane(current,x.type,x.part,x.name);
     const el=document.createElement("div");el.className=`ticket ${done?"done":""}`;
     el.innerHTML=`<div class="row"><div class="name">${x.name}</div><span class="badge ${x.type==="握手"?"hand":"talk"}">${x.type}</span><span class="lane ${lane?"":"missing"}">${lane?`レーン ${lane}`:"レーン要確認"}</span></div>
     <div class="counter"><div class="countText">所持 <strong>${x.count}</strong>枚　残り <strong>${x.count-u}</strong>枚</div><div class="stepper"><button class="step minus">−</button><span class="used">${u}</span><button class="step plus">＋</button></div></div>`;
     el.querySelector(".minus").onclick=()=>setUsed(current,x,u-1);el.querySelector(".plus").onclick=()=>setUsed(current,x,u+1);sec.appendChild(el);
   });app.appendChild(sec);
 });
 if(!app.children.length)app.innerHTML='<div class="empty">この日の券はすべて消化済み！</div>';
}

document.getElementById("importBtn").onclick=importMail;
document.getElementById("pdfFile").onchange=e=>importPdf(e.target.files?.[0]);
document.getElementById("clearText").onclick=()=>document.getElementById("mailText").value="";
document.getElementById("clearAll").onclick=()=>{if(confirm("取り込んだ購入データと消化記録をすべて削除しますか？")){orders={};progress={};localStorage.removeItem(ORDERS_KEY);localStorage.removeItem(PROGRESS_KEY);render();}};
document.getElementById("resetProgress").onclick=()=>{if(confirm(`${current}の消化記録をリセットしますか？`)){Object.keys(progress).filter(k=>k.startsWith(current+"|")).forEach(k=>delete progress[k]);localStorage.setItem(PROGRESS_KEY,JSON.stringify(progress));render();}};
document.getElementById("remainingOnly").onclick=()=>{onlyRemaining=!onlyRemaining;render()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{current=b.dataset.date;render()});
render();
</script>
